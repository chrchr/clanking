name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (without the GTK UI)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go test $(go list ./... | grep -v /cmd/clanking-ui)

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Spawn the daemon and play cues
        shell: bash
        env:
          CGO_ENABLED: "0"
          SDL_AUDIODRIVER: dummy
        run: |
          go build -o "$RUNNER_TEMP/bin/clanking.exe" ./cmd/clanking
          export PATH="$RUNNER_TEMP/bin:$PATH"
          clanking selftest
          sleep 3
          clanking status
          echo '{"hook_event_name":"Stop","cwd":"C:\\work"}' | clanking hook
          sleep 1
          clanking status | grep -q "0 dropped"
          cat "$USERPROFILE/.local/state/clanking/clanking.log"
